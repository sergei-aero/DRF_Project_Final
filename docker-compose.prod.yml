services:
  db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    expose:
      - "6379"

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    command: poetry run gunicorn config.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      - db
      - redis
    restart: unless-stopped
    expose:
      - "8000"

  celery:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: poetry run celery -A config worker --loglevel=info
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: poetry run celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    ports:
      - "8080:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: